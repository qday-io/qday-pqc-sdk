services:
  qday-pqc-server:
    container_name: qday-pqc-server
    image: ghcr.io/qday-io/qday-pqc-server:main
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      # Image ENV would otherwise override the mounted YAML (empty = do not override).
      PQC_HTTP_ADDR: ""
      PQC_ALGORITHM: ""
      PQC_LOG_LEVEL: ""
      PQC_SECRET_KEY_FILE: ""
      PQC_PUBLIC_KEY_FILE: ""
    volumes:
      - ./configs/config.yaml:/etc/qday-pqc-server/config.yaml:ro
      - ./data:/data
    networks:
      - qday-pqc-server

networks:
  qday-pqc-server:
    name: qday-pqc-server
    driver: bridge
