services:
  qday-pqc-server:
    container_name: qday-pqc-server
    image: ghcr.io/qday-io/qday-pqc-server:main
    ports:
      - "8080:8080"
    environment:
      PQC_HTTP_ADDR: ":8080"
      PQC_ALGORITHM: ML-DSA-65
      PQC_LOG_LEVEL: info
      PQC_SECRET_KEY_FILE: /data/secret.key
      PQC_PUBLIC_KEY_FILE: /data/public.key
    volumes:
      - qday-pqc-server-keys:/data
    networks:
      - qday-pqc-server

volumes:
  qday-pqc-server-keys:

networks:
  qday-pqc-server:
    name: qday-pqc-server
    driver: bridge
